title: "tellsiddh's blog"
tagline: "Notes on engineering, infrastructure, and the things I break along the way."
description: >-
  Siddharth Jain writing about software engineering, cloud infrastructure,
  databases, and home lab experiments.
url: "https://blog.tellsiddh.com"
baseurl: ""
lang: en

permalink: /:categories/:title/
excerpt_separator: "<!--more-->"

author:
  name: "Siddharth Jain"
  bio: "Curiosity fuels innovation."
  location: "USA"
  avatar: "/assets/images/profile.jpeg"
  twitter: tellsiddh
  links:
    - label: "GitHub"
      url: "https://github.com/tellsiddh"
    - label: "Twitter"
      url: "https://twitter.com/tellsiddh"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - out.txt
  - README.md
  - AGENTS.md
